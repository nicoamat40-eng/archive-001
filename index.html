<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="screen" id="loadingScreen">

        <div class="archive-box">

            <div class="top-secret">ARCHIVE // 001</div>

            <h1>ACCESSING ARCHIVE</h1>

            <p class="status" id="status">IDENTITY CONFIRMED.</p>

            <div class="loader">
                <div class="loader-bar" id="loaderBar"></div>
            </div>

            <p class="percentage" id="percentage">0%</p>

        </div>

    </div>


    <div class="reveal" id="revealScreen">

        <div class="countdown" id="countdown">3</div>

    </div>


    <div class="troll" id="trollScreen">

        <div class="troll-content">

            <img src="troll.gif" alt="You got trolled">

            <h1>YOU REALLY THOUGHT?</h1>

            <p>better luck next time, darling.</p>

            <button onclick="location.reload()">TRY AGAIN</button>

        </div>

    </div>


    <script src="script.js"></script>

</body>
</html>
